<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- RotationReady mascot: Vizsla puppy with stethoscope -->
  <!-- ears (behind head) -->
  <ellipse cx="118" cy="272" rx="54" ry="118" fill="#96552b" transform="rotate(16 118 272)"/>
  <ellipse cx="394" cy="272" rx="54" ry="118" fill="#96552b" transform="rotate(-16 394 272)"/>
  <!-- chest -->
  <ellipse cx="256" cy="452" rx="122" ry="76" fill="#b56838"/>
  <!-- head -->
  <ellipse cx="256" cy="245" rx="148" ry="138" fill="#c0703c"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="320" rx="78" ry="62" fill="#e2a878"/>
  <!-- eyes (amber, big puppy eyes) -->
  <circle cx="200" cy="238" r="23" fill="#3a2412"/>
  <circle cx="312" cy="238" r="23" fill="#3a2412"/>
  <circle cx="207" cy="230" r="7.5" fill="#fff"/>
  <circle cx="319" cy="230" r="7.5" fill="#fff"/>
  <circle cx="194" cy="246" r="3.5" fill="#fff" opacity=".7"/>
  <circle cx="306" cy="246" r="3.5" fill="#fff" opacity=".7"/>
  <!-- nose (Vizslas have brown self-colored noses) -->
  <ellipse cx="256" cy="290" rx="32" ry="23" fill="#7d4527"/>
  <ellipse cx="245" cy="289" rx="5" ry="8" fill="#5e3018"/>
  <ellipse cx="267" cy="289" rx="5" ry="8" fill="#5e3018"/>
  <ellipse cx="247" cy="281" rx="9" ry="5" fill="#94583a" opacity=".6"/>
  <!-- mouth + tongue -->
  <path d="M256 311 L256 330" stroke="#8a4b2a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M218 336 Q256 362 294 336" stroke="#8a4b2a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <ellipse cx="256" cy="366" rx="19" ry="15" fill="#e87a90"/>
  <path d="M256 356 L256 372" stroke="#d05f78" stroke-width="3" stroke-linecap="round"/>
  <!-- stethoscope: ear tubes peeking up on the left, draped tube, chestpiece on the right -->
  <path d="M167 408 L150 372" stroke="#46506b" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M173 412 L172 372" stroke="#46506b" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M165 410 C 192 458, 320 458, 348 406" stroke="#46506b" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M348 406 C 356 418, 362 424, 365 432" stroke="#46506b" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="368" cy="450" r="27" fill="#c3cddd" stroke="#46506b" stroke-width="9"/>
  <circle cx="368" cy="450" r="12" fill="#76829c"/>
</svg>
